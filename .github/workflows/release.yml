# Build Capptivo installers for macOS (Intel + Apple Silicon), Windows, and Linux.
# Trigger: push a version tag (v*) or run manually from the Actions tab.
#
# Unsigned builds for now — macOS users may need right-click → Open once.
# Add Apple/Windows signing secrets later when you have certificates.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # 24.04+: pipewire-rs 0.8 needs PipeWire 1.0 headers (22.04 is 0.3.48).
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Capptivo v__VERSION__
          releaseBody: |
            Download the installer for your platform below.

            **macOS:** builds are unsigned — right-click the app → Open the first time
            (or allow it in System Settings → Privacy & Security).

            **Captions:** need a system `whisper-cli` binary; the app downloads model
            weights on first use.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
