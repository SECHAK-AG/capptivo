# Build Capptivo installers for macOS (Intel + Apple Silicon), Windows, and Linux.
# Trigger: push a version tag (v*) or run manually from the Actions tab.
#
# macOS: ad-hoc signed via tauri.conf.json (`signingIdentity: "-"`) so Screen
# Recording TCC binds to com.capptivo.desktop. Not notarized — users still
# right-click → Open once. Swap in APPLE_* secrets when you have a cert.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # 24.04+: pipewire-rs 0.8 needs PipeWire 1.0 headers (22.04 is 0.3.48).
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Capptivo v__VERSION__
          releaseBody: |
            Download the installer for your platform below.

            **macOS:** first launch — right-click the app → **Open** (Gatekeeper;
            builds are ad-hoc signed, not notarized). Then grant **Screen
            Recording** in System Settings and **quit & reopen** Capptivo.

            **Captions:** need a system `whisper-cli` binary; the app downloads model
            weights on first use.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Catch linker-signed / unbound Info.plist regressions before a draft is published.
      - name: Verify macOS code identity
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target -path '*/bundle/macos/Capptivo.app' -type d | head -1)
          if [[ -z "$APP" ]]; then
            echo "Capptivo.app not found under src-tauri/target" >&2
            exit 1
          fi
          echo "Checking $APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q 'Identifier=com.capptivo.desktop' /tmp/codesign.txt
          ! grep -q 'Info.plist=not bound' /tmp/codesign.txt
          ! grep -q 'linker-signed' /tmp/codesign.txt
          echo "macOS code identity OK"
