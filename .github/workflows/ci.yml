# Run the checks that already exist in the repo but never had a gate:
# `pnpm typecheck`, the 31 `*.selfcheck.ts` modules, and the Rust suite.
#
# Release builds live in release.yml and only fire on a version tag — by then
# a regression has already shipped. This runs on every push and PR instead.
#
# `--no-default-features` on the Rust step is deliberate: Cargo.toml documents
# that the default capture features need a display and platform SDKs, and that
# the no-default build is what stays green everywhere.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant — don't queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must match the `packageManager` field in package.json.
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and selfchecks
        run: pnpm test

      # The Rust step still links the Tauri crate, so the GTK/WebKit stack has
      # to be present even though nothing here opens a window.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Rust tests
        run: cargo test --no-default-features --manifest-path src-tauri/Cargo.toml
