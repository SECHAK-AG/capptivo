<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- iOS-like continuous corner (~22.37% of edge) -->
    <linearGradient id="bg" x1="18%" y1="8%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#F37B42"/>
      <stop offset="45%" stop-color="#E66028"/>
      <stop offset="100%" stop-color="#C74A16"/>
    </linearGradient>
    <linearGradient id="mark" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5A2208" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="sheen" cx="28%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="12%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- Transparent outside; rounded app-icon plate -->
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
    <rect width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>
    <rect width="1024" height="1024" rx="228" ry="228" fill="url(#rim)"/>
  </g>

  <!-- Soft outer plate shadow (under the rounded shape) -->
  <rect
    x="8" y="14" width="1008" height="1008" rx="224" ry="224"
    fill="none"
    stroke="#5A2208"
    stroke-opacity="0.12"
    stroke-width="0"
  />

